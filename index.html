ul{margin:0;padding-left:18px;font-size:.88rem;line-height:1.55}

  ['Cu',30,150,400,110],['S',110,150,560,175],['O',75,117,525,140],['O',145,117,595,140],['O',75,183,525,210],['O',145,183,595,210],
  ['O',60,240,400,225],['H',35,265,495,120],['H',85,265,625,120],['O',175,240,440,225],['H',150,265,495,235],['H',200,265,625,235]],
 rb:[[1,2],[1,3],[1,4],[1,5],[0,4,'i'],[7,8],[7,9],[7,10],[7,11],[6,10,'i'],[12,13],[12,14],[15,16],[15,17]],
 pb:[[1,2],[1,3],[1,4],[1,5],[7,8],[7,9],[7,10],[7,11],[4,13],[5,14],[10,16],[11,17],[12,15,'d']],
 rl:[[270,55,'CuSO₄'],[270,150,'CuSO₄'],[290,258,'2H₂O']],pl:[[460,62,'Cu'],[460,122,'Cu'],[420,272,'O₂'],[665,62,'H₂SO₄'],[665,177,'H₂SO₄']]},
{name:'황산구리 전기분해 (구리 전극)',eq:'Cu(양극) → Cu²⁺ + 2e⁻ → Cu(음극)',note:'전극이 구리면 양극의 구리가 녹아 이온이 되고, 같은 양이 음극에 쌓입니다. 흑연 전극과 반응이 다릅니다.',
 atoms:[['Cu',60,50,630,50],['Cu',60,115,630,115],['Cu',60,180,630,180],['Cu',60,245,630,245]],
 rb:[],pb:[],rl:[[60,284,'양극(+)']],pl:[[630,284,'음극(−)']]}];
const SIMOF={H:[0,2,3,4,5],O:[0,1,2,3,4,5],C:[1,3,4],K:[1],Ca:[1],Cl:[1],Mg:[2],Na:[3],I:[4],Cu:[5,6],S:[5]};
const SC={H:['#e8eef2',14],O:['#e0574f',20],C:['#4d5964',19],K:['#b06cff',19],Ca:['#ebc765',22],Cl:['#5fbf7a',20],Mg:['#6fae7a',19],Na:['#f0c040',19],S:['#e6d44a',19],Cu:['#d98a4a',19],I:['#8a4fb0',22],R:['#9aa6b0',24],AA:['#6aa0c8',40]};const NM={AA:'C₆H₆O₆'};
let simL=[],simC=0,simP=0,simPlay=false,simLast=0;
const clp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v)),eas=t=>t*t*(3-2*t);
const cssv=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function simHTML(e){const l=SIMOF[e[1]];
 if(!l){return e[11].startsWith('금속 원자')?'':`<h3>관련 반응식</h3><div class="rx">${e[11]}</div>`;}
 return `<h3>반응식 시뮬레이션</h3><div class="sim"><div class="tb" id="stb"></div><canvas id="simcv" width="720" height="290"></canvas>
 <div class="eq" id="seq"></div><p class="nt" id="snt"></p>
 <div class="c"><button id="splay">▶ 반응 시작</button><input type="range" id="ssl" min="0" max="1000" value="0" aria-label="반응 진행도"><button class="off" id="srs">↺</button></div>
 <p class="bl" id="sbl"></p></div>`;}
function mountSim(e){const l=SIMOF[e[1]];simL=l||[];if(!l)return;
 $('stb').innerHTML=l.length>1?l.map(i=>`<button class="off" data-i="${i}">${RX[i].name}</button>`).join(''):'';
 document.querySelectorAll('#stb button').forEach(b=>b.onclick=()=>simSet(+b.dataset.i));
 $('splay').onclick=()=>{if(simP>=1)simP=0;simPlay=true;$('splay').textContent='⏸ 진행 중'};
 $('srs').onclick=()=>{simP=0;simPlay=false;$('splay').textContent='▶ 반응 시작'};
 $('ssl').oninput=()=>{simPlay=false;simP=$('ssl').value/1000};simSet(l[0]);}
function simSet(i){simC=i;simP=0;simPlay=false;const r=RX[i];
 document.querySelectorAll('#stb button').forEach(b=>b.classList.toggle('off',+b.dataset.i!==i));
 $('seq').textContent=r.eq;$('snt').textContent=r.note;$('splay').textContent='▶ 반응 시작';}
function sBonds(list,al,P,x){if(al<=0)return;x.globalAlpha=al;x.strokeStyle=cssv('--sub');
 list.forEach(([i,j,t])=>{x.setLineDash(t==='i'?[5,5]:[]);x.lineWidth=t==='d'?8:5;x.beginPath();x.moveTo(...P[i]);x.lineTo(...P[j]);x.stroke();
  if(t==='d'){x.strokeStyle=cssv('--bg');x.lineWidth=3;x.setLineDash([]);x.beginPath();x.moveTo(...P[i]);x.lineTo(...P[j]);x.stroke();x.strokeStyle=cssv('--sub')}});
 x.setLineDash([]);x.globalAlpha=1}
function sLabels(L,al,x){x.globalAlpha=al;x.fillStyle=cssv('--ink');x.font='700 24px "Gothic A1",sans-serif';x.textAlign='center';L.forEach(l=>x.fillText(l[2],l[0],l[1]));x.globalAlpha=1}
function simDraw(){const cv=$('simcv');if(!cv)return;const x=cv.getContext('2d'),r=RX[simC];
 const k=eas(clp((simP-.25)/.5)),P=r.atoms.map(a=>[a[1]+(a[3]-a[1])*k,a[2]+(a[4]-a[2])*k]);
 x.clearRect(0,0,720,290);if(r.tint){x.globalAlpha=.3*(1-clp(simP/.8));x.fillStyle=r.tint;x.fillRect(0,0,720,290);x.globalAlpha=1}x.strokeStyle=cssv('--line');x.lineWidth=3;x.beginPath();x.moveTo(336,150);x.lineTo(384,150);x.lineTo(372,140);x.moveTo(384,150);x.lineTo(372,160);x.stroke();
 const ra=1-clp((simP-.1)/.2),pa=clp((simP-.7)/.2);
 sBonds(r.rb,ra,P,x);sBonds(r.pb,pa,P,x);sLabels(r.rl,ra,x);sLabels(r.pl,pa,x);
 r.atoms.forEach((a,i)=>{const[c,rad]=SC[a[0]];x.fillStyle=c;x.beginPath();x.arc(P[i][0],P[i][1],rad,0,7);x.fill();x.strokeStyle=cssv('--sub');x.lineWidth=1.5;x.stroke();
  x.fillStyle=a[0]==='H'?'#16222c':'#fff';x.font='700 '+(rad>30?14:rad>16?18:15)+'px sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText(NM[a[0]]||a[0],P[i][0],P[i][1]+1);x.textBaseline='alphabetic'});
 $('ssl').value=Math.round(simP*1000);const b=$('sbl');b.className='bl'+(simP>=1?' ok':'');
 b.textContent=simP>=1?'✓ 반응 전후 모든 원소의 원자 수가 같습니다 (질량 보존)':'슬라이더를 끝까지 움직이면 반응이 완료됩니다';}
function simTick(t){const dt=Math.min(.05,(t-simLast)/1000);simLast=t;
 if(simPlay){simP=matchMedia('(prefers-reduced-motion:reduce)').matches?1:Math.min(1,simP+dt/4);if(simP>=1){simPlay=false;$('splay').textContent='↻ 다시 보기'}}simDraw();}
const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
function loop(t){requestAnimationFrame(loop);simTick(t);
 G.rotation.set(rx,ry,0);cam.position.z=cam.userData.d*zoom;cam.lookAt(0,0,0);
 blocks.forEach(b=>{const tz=b===sel?.7:0;b.position.z+=(tz-b.position.z)*.15;});
 flame.visible=burn&&!!sel;
 if(flame.visible){flame.position.set(sel.position.x,sel.position.y+.9,sel.position.z+.3);
  flame.material.color.set(sel.userData.e[9][0]);const f=reduce?1:1+Math.sin(t*.02)*.12;flame.scale.set(f,1.8*f,f);}
 R.render(S,cam);}
requestAnimationFrame(loop);
</script></body></html>
