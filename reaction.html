<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>반응식 애니메이션 · 원자 재배열</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚛️</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#e8edf0;--ink:#16222c;--sub:#55646f;--panel:#f6f8f9;--line:#c5d0d7;--acc:#1d4f6e;--ok:#1f7a4d;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a20;--ink:#e6edf1;--sub:#93a3ae;--panel:#1a252d;--line:#2d3b45;--acc:#7fc1e6;--ok:#6fd49c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121a20;--ink:#e6edf1;--sub:#93a3ae;--panel:#1a252d;--line:#2d3b45;--acc:#7fc1e6;--ok:#6fd49c;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Gothic A1","Noto Sans KR",system-ui,sans-serif;padding:14px 14px 24px;max-width:860px;margin-inline:auto}
h1{font-size:1.25rem;font-weight:900;margin:0 0 2px}
p.s{margin:0 0 12px;color:var(--sub);font-size:.85rem}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
button{font:inherit;font-weight:700;border:1px solid var(--line);border-radius:6px;padding:8px 14px;background:var(--panel);color:var(--ink);cursor:pointer}
button.on,button.go{background:var(--acc);color:var(--bg);border-color:var(--acc)}
button:focus-visible,input:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px}
canvas{width:100%;display:block}
#eq{font-size:1.5rem;font-weight:900;text-align:center;margin:12px 0 2px}
#note{text-align:center;color:var(--sub);font-size:.85rem;margin:0 0 12px}
.ctl{display:flex;gap:10px;align-items:center;margin-bottom:12px}
input[type=range]{flex:1;accent-color:var(--acc)}
.cnt{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.chip{border:1px solid var(--line);border-radius:8px;padding:6px 12px;background:var(--bg);font-weight:700}
.chip small{color:var(--sub);font-weight:400}
#bal{margin:8px 0 0;font-weight:700;color:var(--sub)}
#bal.ok{color:var(--ok)}
</style></head><body>
<h1>반응식 애니메이션</h1>
<p class="s"><a href="index.html">← 3D 주기율표</a><br>반응 버튼을 누르거나 슬라이더를 움직여 보세요. 결합이 끊기고 원자가 재배열되어도 개수는 그대로입니다.</p>
<div class="tabs" id="tabs"></div>
<div class="box"><canvas id="cv" width="720" height="290" aria-label="원자 재배열 애니메이션"></canvas></div>
<div id="eq"></div><p id="note"></p>
<div class="ctl"><button class="go" id="play">▶ 반응 시작</button><input type="range" id="sl" min="0" max="1000" value="0" aria-label="반응 진행도"><button id="rs">↺</button></div>
<div class="box"><b>원소별 원자 수 (반응 전 → 반응 후)</b><div class="cnt" id="cnt"></div><p id="bal"></p></div>
<script>
const COL={H:['#e8eef2',14],O:['#e0574f',20],C:['#4d5964',19],K:['#b06cff',19],Ca:['#ebc765',22],Cl:['#5fbf7a',20],Mg:['#6fae7a',19],Na:['#f0c040',19],S:['#e6d44a',19],Cu:['#d98a4a',19],I:['#8a4fb0',22],R:['#9aa6b0',24],AA:['#6aa0c8',40]};const NM={AA:'C₆H₆O₆'};
const RX=[
{name:'물의 전기분해',eq:'2H₂O → 2H₂ + O₂',note:'물 2분자가 쪼개져 수소 기체 2분자와 산소 기체 1분자가 됩니다.',
 atoms:[['O',110,130,600,150],['H',80,165,452,95],['H',140,165,452,205],['O',250,130,638,150],['H',220,165,488,95],['H',280,165,488,205]],
 rb:[[0,1],[0,2],[3,4],[3,5]],pb:[[1,4],[2,5],[0,3,'d']],
 rl:[[110,205,'H₂O'],[250,205,'H₂O']],pl:[[470,150,'H₂'],[470,245,'H₂'],[619,190,'O₂']]},
{name:'탄산칼슘 침전',eq:'K₂CO₃ + CaCl₂ → CaCO₃↓ + 2KCl',note:'이온이 짝을 바꿔 물에 녹지 않는 CaCO₃가 흰색 앙금으로 생깁니다.',
 atoms:[['C',110,140,470,105],['O',110,102,470,67],['O',78,160,438,125],['O',142,160,502,125],['K',45,200,590,95],['K',175,200,590,205],
        ['Ca',285,135,470,165],['Cl',250,185,630,95],['Cl',320,185,630,205]],
 rb:[[0,1],[0,2],[0,3],[4,2,'i'],[5,3,'i'],[6,7,'i'],[6,8,'i']],pb:[[0,1],[0,2],[0,3],[6,2,'i'],[6,3,'i'],[4,7,'i'],[5,8,'i']],
 rl:[[110,250,'K₂CO₃'],[285,250,'CaCl₂']],pl:[[470,225,'CaCO₃ ↓ 흰색 앙금'],[610,125,'KCl'],[610,235,'KCl']]},
{name:'마그네슘-공기 전지',eq:'2Mg + O₂ + 2H₂O → 2Mg(OH)₂',note:'마그네슘이 전자를 내놓고(산화), 산소가 전자를 받아 OH⁻가 되어(환원) Mg(OH)₂가 생깁니다.',
 atoms:[['Mg',45,110,525,100],['Mg',45,200,525,200],['O',120,150,572,100],['O',158,150,572,200],['O',240,100,478,100],['H',212,128,440,100],['H',268,128,600,100],['O',240,210,478,200],['H',212,238,440,200],['H',268,238,600,200]],
 rb:[[2,3,'d'],[4,5],[4,6],[7,8],[7,9]],pb:[[0,4,'i'],[0,2,'i'],[4,5],[2,6],[1,7,'i'],[1,3,'i'],[7,8],[3,9]],
 rl:[[45,268,'2Mg'],[139,118,'O₂'],[240,276,'2H₂O']],pl:[[525,150,'Mg(OH)₂'],[525,252,'Mg(OH)₂ ↓']]},
{name:'화산 실험',eq:'C₄H₆O₅ + 2NaHCO₃ → Na₂C₄H₄O₅ + 2CO₂↑ + 2H₂O',note:'사과산의 H가 탄산수소 이온으로 옮겨가 물과 CO₂ 거품이 생깁니다. R은 사과산의 나머지 부분(C₂H₄O)을 한 덩어리로 단순화한 것입니다.',
 atoms:[['R',120,60,440,60],['C',60,60,380,60],['C',180,60,500,60],['O',60,22,380,22],['O',35,92,355,92],['O',180,22,500,22],['O',205,92,525,92],['H',20,125,425,210],['H',225,125,425,270],
  ['Na',30,205,330,130],['C',90,205,560,190],['O',90,168,520,190],['O',125,225,600,190],['O',60,238,395,185],['H',30,262,370,210],
  ['Na',180,205,560,130],['C',240,205,560,250],['O',240,168,520,250],['O',275,225,600,250],['O',210,238,395,245],['H',180,262,370,270]],
 rb:[[0,1],[0,2],[1,3,'d'],[1,4],[4,7],[2,5,'d'],[2,6],[6,8],[10,11,'d'],[10,12],[10,13],[13,14],[9,12,'i'],[16,17,'d'],[16,18],[16,19],[19,20],[15,18,'i']],
 pb:[[0,1],[0,2],[1,3,'d'],[1,4],[2,5,'d'],[2,6],[9,4,'i'],[15,6,'i'],[11,10,'d'],[10,12,'d'],[17,16,'d'],[16,18,'d'],[13,14],[13,7],[19,20],[19,8]],
 rl:[[120,125,'사과산'],[150,286,'2NaHCO₃']],pl:[[440,152,'Na₂ 사과산염'],[660,197,'CO₂↑'],[660,257,'CO₂↑'],[470,205,'H₂O'],[470,265,'H₂O']]},
{name:'비타민 C와 아이오딘',eq:'C₆H₈O₆ + I₂ → C₆H₆O₆ + 2H⁺ + 2I⁻',note:'비타민 C가 H를 내놓고 산화되고, 아이오딘은 I⁻로 환원됩니다. 파란 배경이 사라지는 것은 청남색(아이오딘-전분)이 없어지는 장면입니다.',
 tint:'#2b3a9a',
 atoms:[['AA',120,120,470,105],['H',70,85,580,65],['H',170,85,580,115],['I',250,130,580,175],['I',305,130,580,235]],
 rb:[[0,1],[0,2],[3,4]],pb:[],
 rl:[[120,190,'비타민 C'],[278,190,'I₂']],pl:[[450,190,'산화된 비타민 C'],[640,70,'H⁺'],[640,120,'H⁺'],[640,180,'I⁻'],[640,240,'I⁻']]},
{name:'황산구리 전기분해 (흑연)',eq:'2CuSO₄ + 2H₂O → 2Cu + O₂ + 2H₂SO₄',note:'음극에서 Cu²⁺가 Cu로 석출되고, 양극에서 물이 분해되어 O₂가 나옵니다. 용액은 황산이 되어 산성이 됩니다.',
 atoms:[['Cu',30,55,400,50],['S',110,55,560,60],['O',75,22,525,25],['O',145,22,595,25],['O',75,88,525,95],['O',145,88,595,95],
  ['Cu',30,150,400,110],['S',110,150,560,175],['O',75,117,525,140],['O',145,117,595,140],['O',75,183,525,210],['O',145,183,595,210],
  ['O',60,240,400,225],['H',35,265,495,120],['H',85,265,625,120],['O',175,240,440,225],['H',150,265,495,235],['H',200,265,625,235]],
 rb:[[1,2],[1,3],[1,4],[1,5],[0,4,'i'],[7,8],[7,9],[7,10],[7,11],[6,10,'i'],[12,13],[12,14],[15,16],[15,17]],
 pb:[[1,2],[1,3],[1,4],[1,5],[7,8],[7,9],[7,10],[7,11],[4,13],[5,14],[10,16],[11,17],[12,15,'d']],
 rl:[[270,55,'CuSO₄'],[270,150,'CuSO₄'],[290,258,'2H₂O']],pl:[[460,62,'Cu'],[460,122,'Cu'],[420,272,'O₂'],[665,62,'H₂SO₄'],[665,177,'H₂SO₄']]},
{name:'황산구리 전기분해 (구리 전극)',eq:'Cu(양극) → Cu²⁺ + 2e⁻ → Cu(음극)',note:'전극이 구리면 양극의 구리가 녹아 이온이 되고, 같은 양이 음극에 쌓입니다. 흑연 전극과 반응이 다릅니다.',
 atoms:[['Cu',60,50,630,50],['Cu',60,115,630,115],['Cu',60,180,630,180],['Cu',60,245,630,245]],
 rb:[],pb:[],rl:[[60,284,'양극(+)']],pl:[[630,284,'음극(−)']]}];
const cv=document.getElementById('cv'),x=cv.getContext('2d'),sl=document.getElementById('sl');
let cur=0,p=0,play=false,last=0;
const cl=(v,a=0,b=1)=>Math.min(b,Math.max(a,v)),ease=t=>t*t*(3-2*t);
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()}
function pos(a,p){const k=ease(cl((p-.25)/.5));return[a[1]+(a[3]-a[1])*k,a[2]+(a[4]-a[2])*k]}
function bonds(R,list,al,P){if(al<=0)return;x.globalAlpha=al;x.strokeStyle=css('--sub');
 list.forEach(([i,j,t])=>{const A=P[i],B=P[j];x.setLineDash(t==='i'?[5,5]:[]);x.lineWidth=t==='d'?7:4;
  x.beginPath();x.moveTo(...A);x.lineTo(...B);x.stroke();
  if(t==='d'){x.strokeStyle=css('--panel');x.lineWidth=2.5;x.setLineDash([]);x.beginPath();x.moveTo(...A);x.lineTo(...B);x.stroke();x.strokeStyle=css('--sub')}});
 x.setLineDash([]);x.globalAlpha=1}
function labels(L,al){x.globalAlpha=al;x.fillStyle=css('--ink');x.font='700 24px "Gothic A1",sans-serif';x.textAlign='center';L.forEach(l=>x.fillText(l[2],l[0],l[1]));x.globalAlpha=1}
function draw(){const r=RX[cur],P=r.atoms.map(a=>pos(a,p));
 x.clearRect(0,0,720,290);if(r.tint){x.globalAlpha=.3*(1-cl(p/.8));x.fillStyle=r.tint;x.fillRect(0,0,720,290);x.globalAlpha=1}
 x.strokeStyle=css('--line');x.lineWidth=2;x.beginPath();x.moveTo(336,150);x.lineTo(384,150);x.lineTo(374,142);x.moveTo(384,150);x.lineTo(374,158);x.stroke();
 const ra=1-cl((p-.1)/.2),pa=cl((p-.7)/.2);
 bonds(r,r.rb,ra,P);bonds(r,r.pb,pa,P);labels(r.rl,ra);labels(r.pl,pa);
 r.atoms.forEach((a,i)=>{const[c,rad]=COL[a[0]];x.fillStyle=c;x.beginPath();x.arc(P[i][0],P[i][1],rad,0,7);x.fill();
  x.strokeStyle=css('--sub');x.lineWidth=1.2;x.stroke();x.fillStyle=a[0]==='H'?'#16222c':'#fff';
  x.font='700 '+(rad>30?14:rad>16?18:15)+'px sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText(NM[a[0]]||a[0],P[i][0],P[i][1]+1);x.textBaseline='alphabetic'});
 sl.value=Math.round(p*1000);
 document.getElementById('bal').className=p>=1?'ok':'';
 document.getElementById('bal').textContent=p>=1?'✓ 반응 전후 모든 원소의 원자 수가 같습니다 (질량 보존)':'슬라이더를 끝까지 움직이면 반응이 완료됩니다';}
function setRx(i){cur=i;p=0;play=false;const r=RX[i];
 document.querySelectorAll('#tabs button').forEach((b,j)=>b.classList.toggle('on',j===i));
 document.getElementById('eq').textContent=r.eq;document.getElementById('note').textContent=r.note;
 const n={};r.atoms.forEach(a=>n[a[0]]=(n[a[0]]||0)+1);
 document.getElementById('cnt').innerHTML=Object.entries(n).map(([e,c])=>`<span class="chip">${e} <small>${c} → ${c}</small></span>`).join('');
 document.getElementById('play').textContent='▶ 반응 시작';}
document.getElementById('tabs').innerHTML=RX.map((r,i)=>`<button data-i="${i}">${r.name}</button>`).join('');
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>setRx(+b.dataset.i));
document.getElementById('play').onclick=()=>{if(p>=1)p=0;play=true;document.getElementById('play').textContent='⏸ 진행 중'};
document.getElementById('rs').onclick=()=>{p=0;play=false;document.getElementById('play').textContent='▶ 반응 시작'};
sl.oninput=()=>{play=false;p=sl.value/1000};
const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
function loop(t){requestAnimationFrame(loop);const dt=Math.min(.05,(t-last)/1000);last=t;
 if(play){p=reduce?1:Math.min(1,p+dt/4);if(p>=1){play=false;document.getElementById('play').textContent='↻ 다시 보기'}}draw();}
setRx(0);requestAnimationFrame(loop);
</script></body></html>
